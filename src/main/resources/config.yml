# ------------------------------------------------------------
#  Forgebound Teams
#  /team create <name> <tag> - invite - accept - leave - kick - promote/demote - leader - disband
#  /team color <color|#rrggbb> - /team tag <tag> - /team banner [reset] - /team stash
#  /team ally|unally <team> - /team enemy <team> [stake] - /team peace <team> - /team info|list|top
#  /tc [message] team chat (or start a message with !), /ac <message> team + allies (or start with @)
#  The tag and color show in front of the names (tab list, chat, above heads). Teammates and allies can't hurt
#  each other - Forgebound sees the teams too (abilities, bounties, trackers, combat tag, quests).
# ------------------------------------------------------------

# the most players in one team
max-members: 3
# how many allied teams a team can have
max-allies: 1
# when an alliance ends: for truce-minutes kills between the two teams pay no bounty (they can still fight), and
# the same two teams can't become allies again for a while - so nobody breaks an alliance just to cash in a bounty
alliance:
  truce-minutes: 15
  re-ally-hours: 24
# wars: /team enemy <team> declares war (on both sides at once), /team peace <team> ends it when both leaders agree.
# Kills in a war count extra (points.enemy-kill-bonus) and both teams see the score.
max-enemies: 3
# after peace, the same two teams can't go to war again for this long
war-cooldown-hours: 24
# a war can have a stake: both teams put Bounty Tokens from their stash in (the other side matches it with what
# it has), the team with more kills when the war ends takes it all (a draw = stakes back, disbanding = the other wins)
war-stakes:
  enabled: true
  max: 256
  # a war with a stake ends by itself after this long (0 = only when both leaders make peace)
  hours: 48

# team bounty: killing a member also pays this % of the bounties of the REST of the team (Forgebound bounties)
team-bounty:
  enabled: true
  kill-percent: 10
  max-bonus: 32

# every week the best teams (points earned that week) get Bounty Tokens into their stash
weekly-rewards:
  enabled: true
  day: SUNDAY
  hour: 20
  timezone: "Europe/Prague"
  # 1st, 2nd, 3rd...
  tokens: [30, 20, 10]

# members close to each other get an effect (refreshed every 2 s, no particles)
together:
  enabled: true
  radius: 16
  effect: regeneration
  amplifier: 0
# true = teammates and allies can hurt each other
friendly-fire: false
# Corrupted teams: during Forgebound's big events (The Closing World, The Hunt, The Forge Colossus) teammates and
# allies can hurt and kill each other - every player for themselves. Teams, tags, stash and points stay.
corrupt-during-big-events: true
corrupt-messages:
  start: "&4&lThe teams are corrupted! &7Until the event ends, teammates and allies can kill each other."
  end: "&aThe teams are whole again. &7Teammates and allies are safe from each other."
# names and tags that aren't allowed (anywhere inside, any case)
blocked-words: []

chat:
  # the public chat shows the team like the tab list: <[TAG] Name> message
  show-tag: true
  # a message starting with this goes to the team only ("" = off)
  team-prefix: "!"
  # ... and this to the team and its allies
  ally-prefix: "@"

# the team leaderboard (/team top)
points:
  # killing a player who isn't a teammate or an ally (the same victim again only after same-victim-minutes)
  player-kill: 3
  # on top of that when the teams are at war
  enemy-kill-bonus: 3
  same-victim-minutes: 30
  # any advancement a member gets for the first time / one of Forgebound's own advancements
  advancement: 1
  forgebound-advancement: 3
  # every legend-every-minutes: per Forgebound legend an online member carries (max 3 per player)
  per-legend: 1
  legend-every-minutes: 30
  # bosses (whoever gets the last hit)
  forge-colossus: 20
  bosses:
    ENDER_DRAGON: 15
    WITHER: 10
    WARDEN: 10
    ELDER_GUARDIAN: 5

auto-update:
  enabled: true
  # false = only tell the admins that a new version is out
  download: true
  check-hours: 1
  repo: "Freonik/Forgebound-releases"
